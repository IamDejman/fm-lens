# Report a problem in FM Lens's Settings menu opens this form with the version, FM build, macOS and changes filled
# in (app/src/report.ts): keep these ids in step with it.
name: Bug report
description: Something in FM Lens does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        First check docs/PERSONAL-SCOUT.md. Do not attach game saves, memory dumps, Steam configuration or credentials by default.
  - type: input
    id: version
    attributes:
      label: FM Lens version
      description: At the foot of the Settings menu.
      placeholder: "0.5.4"
    validations:
      required: true
  - type: input
    id: fm-build
    attributes:
      label: FM build
      placeholder: "FM27 Steam 26340721, editing on"
  - type: input
    id: macos
    attributes:
      label: macOS
      placeholder: "macOS 27.2, Apple Silicon"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste any error the app showed.
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What you changed in FM Lens before it happened
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, the player, staff member or club involved, or whether it happens every time.
