name: Bug report
description: Something in FM Lens does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        First check docs/PERSONAL-SCOUT.md. Do not attach game saves, memory dumps, Steam configuration or credentials by default.
  - type: input
    id: version
    attributes:
      label: FM Lens version
      description: Shown at the foot of the app's window.
      placeholder: "0.4.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where you run Football Manager 27
      options:
        - macOS Apple Silicon, Steam
        - Other (describe below; not currently verified)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste any error the app showed.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, the player, staff member or club involved, or whether it happens every time.
