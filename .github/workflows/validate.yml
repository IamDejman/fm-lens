# The checks every pull request must pass before it merges into main (see the branch's protection); it also runs on
# main itself, and can be started by hand. The Windows job also builds the Windows installer; releases are signed and
# published from a Mac with scripts/release.sh (see docs/DEVELOPING.md), which takes that installer from the run on main.
name: Validate FM Lens

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces a run still going.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-checks:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install frontend packages
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build
      - name: Test the report relay
        working-directory: relay
        run: node --test
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --locked --workspace
      - name: Test the writable memory guard separately
        run: cargo test --locked -p fmlens-mem --no-default-features
      - name: Check the writable desktop dependency graph
        run: cargo clippy --locked -p fmlens-app --all-targets -- -D warnings
      - name: Build diagnostics and bridge
        run: cargo build --locked -p fmlens-probe -p fmlens-bridge

  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install frontend packages
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build
      - name: Check Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --locked --workspace
      - name: Test the writable memory guard separately
        run: cargo test --locked -p fmlens-mem --no-default-features
      - name: Check the writable desktop dependency graph
        run: cargo clippy --locked -p fmlens-app --all-targets -- -D warnings
      # Unsigned for updates: scripts/release.sh signs it with the updater key, which never leaves the release Mac.
      - name: Build the installer with the bridge
        working-directory: app
        run: npm run release:windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fm-lens-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
