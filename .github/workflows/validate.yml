# The checks every pull request must pass before it merges into main (see the branch's protection); it also runs on
# main itself, and can be started by hand. Releases are published from a Mac (see docs/DEVELOPING.md), not here.
name: Validate FM Lens

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces a run still going.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-checks:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install frontend packages
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build
      - name: Test the report relay
        working-directory: relay
        run: node --test
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --locked --workspace
      - name: Test the writable memory guard separately
        run: cargo test --locked -p fmlens-mem --no-default-features
      - name: Check the writable desktop dependency graph
        run: cargo clippy --locked -p fmlens-app --all-targets -- -D warnings
      - name: Build diagnostics and bridge
        run: cargo build --locked -p fmlens-probe -p fmlens-bridge
