# Sends PostHog the download counts of FM Lens every hour (scripts/report-downloads.sh), for the "FM Lens growth"
# dashboard. It can also be started by hand.
name: Report downloads

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-downloads
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report-downloads.sh
