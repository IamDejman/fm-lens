[package]
name = "fmlibre-bridge"
description = "The library Football Manager loads on macOS to let FM Lens reach its memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
fmlibre-mem.workspace = true
libc = "0.2.191"
mach2 = "0.7.0"

[build-dependencies]
toml = "1.1.8"

# How Steam starts the game with the bridge; see src/launch.rs.
[[bin]]
name = "fmlibre-launch"
path = "src/launch.rs"
