[package]
name = "fmlens-bridge"
description = "The library Football Manager loads to let FM Lens reach its memory on macOS and run its functions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
fmlens-mem.workspace = true
libc = "0.2.191"
mach2 = "0.7.0"

[target.'cfg(windows)'.dependencies]
fmlens-mem.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
static_vcruntime = "3.0.0"
toml = "1.1.8"

# How Steam starts the game with the bridge; see src/launch.rs.
[[bin]]
name = "fmlens-launch"
path = "src/launch.rs"
