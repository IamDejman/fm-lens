<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release notes: FM Lens</title>
  <meta name="description" content="What is new in each version of FM Lens, the free Football Manager 27 editor for Mac and Windows.">
  <link rel="canonical" href="https://getfmlens.com/releases/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FM Lens">
  <meta property="og:url" content="https://getfmlens.com/releases/">
  <meta property="og:title" content="Release notes: FM Lens">
  <meta property="og:description" content="What is new in each version of FM Lens, the free Football Manager 27 editor for Mac and Windows.">
  <meta property="og:image" content="https://getfmlens.com/images/social.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#251b37">
  <link rel="icon" type="image/png" sizes="64x64" href="../images/icon-64.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap bar">
      <a class="brand" href="/" aria-label="FM Lens home">
        <img src="../images/symbol.png" alt="" width="40" height="40">
        <span translate="no">FM Lens</span>
      </a>
      <nav aria-label="Elsewhere">
        <a class="star" href="https://github.com/IamDejman/fm-lens" aria-label="Star FM Lens on GitHub"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8l2.5 5.2 5.7.8-4.1 4 1 5.7L10 14.8l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg>Star<span class="star-where"> on GitHub</span></a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <div class="message intro">
      <h1>Release notes</h1>
      <p id="status" role="status">Loading the releases…</p>
    </div>
    <div id="releases" class="releases"></div>
  </main>

  <script type="module">
    import "../analytics.js";
    import { releaseNotes, releaseNotesHtml } from "../release.js";

    // The published page already holds the notes (scripts/build-site.mjs), with the newest version they had then.
    const status = document.getElementById("status");
    const list = document.getElementById("releases");
    const releases = await releaseNotes();
    if (!releases && !list.dataset.latest) {
      status.textContent = "The release notes could not be loaded. Try again in a moment.";
    } else {
      status?.remove();
      if (releases?.length > 0 && releases[0].version !== list.dataset.latest) {
        list.innerHTML = releaseNotesHtml(releases);
        list.dataset.latest = releases[0].version;
        // The app links to a version's notes (#v0.5.6); they are only here once the list is.
        document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
      }
    }
  </script>
</body>
</html>
