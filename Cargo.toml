[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.5.7"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["FM Lens contributors"]

[workspace.dependencies]
# The app's dependency graph allows writes; the probe explicitly enables `read-only`.
# Cargo unifies that feature during workspace checks. Build the desktop package separately.
fmlens-mem = { path = "crates/fmlens-mem", default-features = false }
fmlens-core = { path = "crates/fmlens-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size-oriented release settings recommended by Tauri: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
