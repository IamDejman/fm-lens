# Field offsets inside FM27 objects (heap data owned by game_plugin.dll).
#
# Offsets are the same for every storefront build of a game version, so they live
# apart from the per-build addresses in the build profiles next to this file.
# First mapped on Steam by fm-editor (https://github.com/barak14/fm-editor,
# GPL-3.0-or-later); verified on the Game Pass build 0.9.2355.0 with Lionel Messi
# (UID 7458500) and Erling Haaland (UID 29179241) unless noted otherwise.
edition = 27

[player]
uid = 0x294               # u32
full_name = 0x2C8         # FM string pointer; may be null
first_name = 0x2D8        # name-table entry pointer
last_name = 0x2E0         # name-table entry pointer
common_name = 0x2E8       # name-table entry pointer; null when the player has none
date_of_birth = 0x310     # u16 day of year (low 9 bits) + u16 year
current_ability = 0x264   # u16, 1..200
potential_ability = 0x266 # i16, 1..200; negative values are ranges
nation = 0x2F0            # nation pointer
relations = 0x300         # pointer to the record of his relations; as on macOS, 0x40 further (checked on Steam)
team = 0x130              # team pointer; the club hangs off the team

# The person block starts here in plain players. Player-coaches carry an extra
# block in front of it, so every field from here on sits 0xF8 further for them.
person_block = 0x288
person_block_shifts = [0x0, 0xF8]
# The ACTUAL_PERSON the game's signing takes: MSVC lays the person block out as PERSON, then ACTUAL_PERSON with its own
# virtual-base pointer. ACTUAL_PLAYER's RTTI and virtual-base table give 0x288 and 0x2B0 (Steam 26340721).
actual_person = 0x2B0

height = 0x22E            # u16, centimetres
# Live values, 0..10000 (100.00%). Checked against the game's own words on the test save:
# Matthijs de Ligt, injured, 3500 sharpness ("lacking match fitness"); Bruno Fernandes 6700
# ("gaining match fitness"); both "fresh" at 8980 and 10000 condition.
match_sharpness = 0x258   # u16; the game keeps it at 3500 or above
condition = 0x25C         # u16, the energy the game shows
# i16, how worn out he is by playing, which rest takes away; FMRTE calls it jadedness. Found from
# FMRTE's readings on the Game Pass save (27 July 2026): Kylian Mbappé -500, Arda Güler -274,
# Amad -315. The game keeps it at -500 or above: 1,587 players, rested over the summer, sit at
# -500; the most on that save, early in the season, was 252.
jadedness = 0x25A
# u8, 1..20: morale, which the game shows as overall happiness ("Genel Mutluluk"). Arda Güler
# read "Memnun" (content) at 10, "Biraz Mutlu" (slightly happy) at 11 and "Aşırı Mutlu"
# (extremely happy) at 20; FM Live Editor 27's morale words for 15 Manchester United players
# fell in line with it (Okay 10, Fairly Good 11, Quite Good 12, Good 13, Really Good 14, Very
# Good 15). The byte at 0x1F1 (0..20) moves with it but is not what the game shows; it is
# left alone.
morale = 0x26C
# u64, his traits (preferred moves): bit n is the n-th of FMRTE's list, read row by row (left, right). Read against
# FMRTE for Messi (bits 7 10 16 17 19 20 49 51), Olise, Gvardiol, Kane and Güler (17 19 22 31 58) on the Game Pass
# save. Bits 62 and 63 are not in FMRTE's list as shown; Kane has bit 62.
traits = 0x348
# Pointer to the player's injury record, null for a player who was never injured. The record
# starts with the list (begin, end, capacity) of his current injuries; a player who has got
# over his injuries keeps the record with an empty list.
injuries = 0xF8
transfer_value = 0x234    # i32, base valuation; 300,000,000 is the unvalued marker
asking_price = 0x238      # i32, pounds; -1 when not set
home_reputation = 0x25E   # u16
current_reputation = 0x260
world_reputation = 0x262
international_caps = 0x3BC  # u16
international_goals = 0x3BE # u16
u21_caps = 0x3C0          # u8 (Messi: 18 caps, 14 goals)
u21_goals = 0x3C1         # u8
contract = 0x330          # contract pointer
# 15 ratings, 1..20: GK, SW, DL, DC, DR, DM, ML, MC, MR, AML, AMC, AMR, ST, WBL, WBR
positions = 0x150
# Pointer to the (begin, end, capacity) list of 0x18-byte records the game keeps of his positions and writes
# his ratings back from: read in the game's own position setter and in live memory.
position_records = 0x1A8
# 8 ratings, 1..20: adaptability, ambition, loyalty, pressure, professionalism,
# sportsmanship, temperament, controversy
personality = 0x2F8

# u8, raw 0..100, shown in game as (raw + 2) / 5
[player.attributes]
corners = 0x17A
crossing = 0x15F
dribbling = 0x160
finishing = 0x161
first_touch = 0x175
free_kicks = 0x182
heading = 0x162
long_shots = 0x163
long_throws = 0x17D
marking = 0x164
passing = 0x166
penalty_taking = 0x167
tackling = 0x168
technique = 0x176
aggression = 0x18C
anticipation = 0x170
bravery = 0x18A
composure = 0x193
concentration = 0x194
decisions = 0x171
determination = 0x192
flair = 0x179
leadership = 0x187
off_the_ball = 0x165
positioning = 0x173
teamwork = 0x17B
vision = 0x169
work_rate = 0x17C
acceleration = 0x181
agility = 0x18D
balance = 0x189
jumping_reach = 0x186
natural_fitness = 0x191
pace = 0x185
stamina = 0x184
strength = 0x183
aerial_reach = 0x16B
command_of_area = 0x16C
communication = 0x16D
eccentricity = 0x17E
handling = 0x16A
kicking = 0x16E
one_on_ones = 0x172
punching = 0x180
reflexes = 0x174
rushing_out = 0x17F
throwing = 0x16F
consistency = 0x18B
dirtiness = 0x188
important_matches = 0x18E
injury_proneness = 0x18F
versatility = 0x190
left_foot = 0x177
right_foot = 0x178

# Fields of the contract a player's `contract` pointer leads to.
[contract]
owner = 0x08              # pointer back to the person block of the player or member of staff it belongs to
wage = 0x20               # i32, pounds per week
signed = 0x44             # date
expires = 0x48            # date
joined = 0x4C             # date the player joined the club (Messi: 15 July 2023)
squad_status = 0x54       # u8 (1 star player, 2 important player, 5 impact sub)
listing = 0x57            # u8; bit 0 transfer listed, bit 1 loan listed
squad_number = 0x5D       # u8; 255 = none
team = 0x10               # team pointer (the employer, for staff); its club is at team+0x30
senior_team = 0x18        # the employer's senior team; the same as `team` except for player-coaches
job = 0x26                # u8 job code (1 player, 16 manager, 20 assistant manager, ...)
# Lists (begin, end, capacity) of a contract's extras. Read on the Windows Game Pass build with Kylian Mbappé,
# whose clauses list holds his release clause (859,031,872 pounds, a billion euros) and three bonuses.
clauses = 0x68            # 8-byte entries: u32 amount (0xFFFFFFFF: none), u16 condition (0xFFFF: none), u16 kind
competition_bonuses = 0x80 # 32-byte entries: the competition's UID at +0x14, the amount at +0x18
# Checked against FMRTE's contract page for Kane, Haaland, Alex Scott, Olise and Mbappé (Game Pass, 6 Sep 2026):
# loyalty bonus 33,401 / 43,634 / 20,882 / 37,798 / 50,098, happiness 71 / 60 / 60 / 60 / 80 and playing time
# happiness 4 / 16 / 27 / 8 / 30. Olivier Boscagli's happiness reads -4.
loyalty_bonus = 0x38      # i32, pounds per week
happiness = 0x5A          # i8
playing_time_happiness = 0x5C # i8
# Pointer to the record of the player's reasons to be unhappy (FMRTE's "Unhappiness"), null for a player who never had
# one: a u8 count, then a ring of ten pointers to 28-byte entries and at +0x58 the slot of the oldest (start and end
# date, what it is about, the motive at +0x16, the type at +0x18: 1 concerned, 2 internal). An entry stays listed,
# with an end date, after it is over.
# Thibaut Courtois: 1 entry from 17 August 2026, motive 0x39E ("doesn't believe Dean Huijsen deserves the playing
# time he wants"); Malick Yalcouyé: left out of the UEFA Conference League squad from 4 September (0x254, internal).
unhappiness = 0x30

# Static data in game_plugin.dll next to the entity arrays. Offsets are relative to
# the players (begin, end) pair: the cluster moves as one block between builds.
[cluster]
# Current in-game date: u16 day of year (flags above bit 8) + u16 year. Confirmed
# by the game's UI strings ("Cts 18 Tem", "18 Temmuz 2026") in the test save.
# The November 2026 update (Game Pass 0.9.2409.0, Steam build 26340721) leaves it
# unset (1 January 1900) with a save loaded: their build profiles name the date's
# own variable (`current_date`), which wins.
current_date = 0x848

# Non-player staff. Offsets from fm-editor's FM27 notes (Steam), checked on the Game
# Pass build with the witnesses listed in docs/recon.
[staff]
uid = 0x10C               # u32 staff id
full_name = 0x140         # FM string pointer; often null
first_name = 0x150        # name-table entry pointer
last_name = 0x158         # name-table entry pointer
common_name = 0x160       # name-table entry pointer
nation = 0x168            # nation pointer
personality = 0x170       # 8 ratings, same order as for players
date_of_birth = 0x188     # date
contract = 0x1A8          # contract pointer (same record as a player's contract)
home_reputation = 0xD4    # u16
current_reputation = 0xD6
world_reputation = 0xD8
current_ability = 0xDA    # u16
potential_ability = 0xDC  # u16
# The person block starts here (a contract points back at it). In the human
# manager's object every field from here on sits 0x340 further: id, names, nation,
# personality, birth date and contract. Attributes, reputation and CA/PA stay put.
person_block = 0x100
person_block_shifts = [0x0, 0x340]
# As for players, 0x28 into the person block (ACTUAL_NON_PLAYER's virtual-base table: 0x100, 0x128).
actual_person = 0x128
# As on macOS 0x38 further (the person block's 0x30 and 8 more): his relations record, laid out as a player's,
# FM's coaching qualification and the formations he prefers in and out of possession. Read on Steam 26340721:
# Arteta has 12 favoured or disliked people and clubs and Guardiola 22; both hold the Continental Pro licence (1).
relations = 0x178
coaching_licence = 0x23C
formations = [0xDF, 0xE3]

# u8, raw 0..100, shown as (raw + 2) / 5

[staff.attributes]
attacking = 0x32
defending = 0x33
fitness = 0x34
goalkeeping = 0x2B
possession = 0x35
tactical = 0x37
technical = 0x36
set_pieces = 0x43
determination = 0x1D
motivating = 0x2F
people_management = 0x2E
judging_ability = 0x2C
judging_potential = 0x2D
judging_staff = 0x42
negotiating = 0x41
tactical_knowledge = 0x31
data_analysis = 0x3C
physiotherapy = 0x30
sports_science = 0x3F

# u8 ratings stored as shown, 1..20
[staff.ratings]
working_with_youngsters = 0x1C
authority = 0x14

# One current injury, from a player's list of them (see `injuries` above).
[injury]
kind = 0x08               # pointer to the kind of injury; its name, an FM string, is at kind+0x18
team = 0x18               # the team he was with when it happened
started = 0x20            # date
longest = 0x28            # u16 days from `started` until he is back at the latest
shortest = 0x2A           # u16 days until he is back at the soonest
kind_name = 0x18

# A person's relations: the list of 16-byte entries the record of his `relations` starts with. Each points at a
# nation, club, person or competition and says how he is tied to it. Read on the Mac Steam build; on the Windows
# Steam and Game Pass builds Kenan Yıldız, Jamal Musiala and Achraf Hakimi read the same entries as on the Mac.
[relation]
target = 0x00             # pointer to the nation, club, person or competition
target_kind = 0x0A        # u8: 1 a club, 3 a person, 7 a competition, 8 a nation
relation = 0x0B           # u8: 9 a nationality, 70 trained in a nation, 72 trained at a club
value = 0x0C              # u8: of a training, the homegrown rule it meets
size = 0x10

# A player's current bans sit in the same record as his injuries: after the list of his
# current injuries, a list of his absences, 32-byte entries. Other absences, such as a
# call-up, are listed with them; a ban has 0xFFFF at `marker`, they have 0. Read on the
# Mac Steam build, whose records are laid out as here; on the Windows builds Elliot Watt reads
# his two bans (1 and 4 matches), among 17 banned players on the Steam save and 48 on the Game
# Pass one.
[ban]
list = 0x18               # in the record: the list (begin, end, capacity) of absences
started = 0x10            # date the ban began
marker = 0x16             # u16, 0xFFFF for a ban
matches = 0x1C            # u8, matches left to miss

# A promise made to a person (INTERACTION_PROMISE, 0x60 bytes), laid out as on the Mac; only his list sits elsewhere in
# the person block (0x360 in a player, as other player fields here sit 0x40 past the Mac's). Read on the Windows Steam
# build, Arsenal, 1 Aug 2026: Jurriën Timber's list held the one promise FM's Promises page listed (preferred position,
# made 1 Aug 2026, due 28 Jan 2027, category 1, open).
[promise]
list = 0xD8               # in the person block: pointer to the list (begin, end, capacity) of his promises
person = 0x20             # pointer back at him
made = 0x38               # date
due = 0x3C                # date: due while open, ended once closed
id = 0x4E                 # u16, FM's number for the promise
closed = 0x53             # u8, bit 0
category = 0x55           # u8, 0 for the promises FM's Promises page does not list
status = 0x56             # u8, 0 while open; 1 ended without being held against him

# The retirements the game has planned (FMRTE's "Retire Date"), which its retirement manager (RETIREMENT_MANAGER)
# keeps. Read on the Game Pass save (6 September 2026), where the manager listed 27, among them Cristiano Ronaldo on
# 30 June 2027 and Daniel Wass on 1 July 2027 as FMRTE shows; nothing but the manager's two lists points at an entry.
# An entry is 24 bytes: the person's id, a club's (-1 for a free agent), two dates, the date he retires and flags.
# The static pointer to the manager is not at the same distance from the arrays on Game Pass and Steam: the build
# profiles place it.
[retirement]
planned = 0x30           # in the manager: (begin, end, capacity) of pointers to the entries
by_person = 0x90          # in the manager: (begin, end, capacity) of 16-byte entries: u32 person id, 4 spare bytes, pointer; sorted by id
person = 0x00             # in an entry: u32 person id
date = 0x0C               # in an entry: the date he retires
player_person = 0x290     # in a player: u32, the game's id of the person (Ronaldo 0x0A30, Wass 0x0E69)

[team]
club = 0x30               # club pointer
# u8, the kind of team: on the test save 0 for the first team, 10 for the under-21s and
# 12 for the under-18s (Manchester United).
kind = 0x28
age_limit = 0x2C          # u8, the oldest its players may be (21, 18); 100 for no limit
# Player pointers as (begin, end, capacity): the players under contract with the team
# (those out on loan too) and the players on loan to it. A player is always in the list
# of the team he plays for (player `team`).
players = 0x38
# Pointers to the person blocks of the captain and the vice-captain; null when the team has
# none. Manchester United's are Bruno Fernandes and Lisandro Martínez, as the game shows.
captain = 0x88
vice_captain = 0x90
reputation = 0xA8         # u16, 0..10000; the club's reputation lives on its senior team
# The manager's object, as for a national team. Arsenal's senior team points at its human manager (staff id
# 2002071616, his person block 0x340 further) on Steam 26340721.
manager = 0x80
national = 0x2F           # u8: 0 for a club's team, else a nation's (set_work_permit reads it)

# A team's dynamics record, from the game's code (docs/EDITING-VALIDATION.md). A team points at a holder, which points
# at the record; the record points back at its team. It keeps the dressing room atmosphere (i8 at 0xCB) and the support
# for the manager (i8 at 0xCE), each with the date the game worked it out. The game's own logic, such as the squad
# complaining about the atmosphere, reuses a score for seven days after its date; FM's Dynamics screen does not.
# Arsenal, 10 Dec 2027: atmosphere -62, worked out on 7 Dec.
[dynamics]
holder = 0xA0             # in a team: pointer to the holder
record = 0xC8             # in the holder: pointer to the record
team = 0x40               # in the record: pointer back at the team
atmosphere_date = 0xA8    # date the atmosphere score was worked out; 1 Jan 1900 before the first time
support_date = 0xAC       # date the support score was worked out

# The game's allocator hands out blocks in size classes, without headers. Measured on
# the buffers of the teams' player lists (probe `squads`): a list of n pointers sits in
# the smallest of these blocks that holds 8 * n bytes, and the bytes after its end up to
# the block's end are zero. Only sizes from just above the first value to the last one
# are relied on; smaller and larger lists were not measured well enough.

[heap]
block_sizes = [144, 160, 192, 224, 256, 288, 320, 384, 448, 512]

# Checked on Tottenham Hotspur (UID 728) in the Game Pass build, against values
# fm-editor witnessed on Steam (founded 1882, 50,000 season tickets, 6.8M social
# followers, supporter traits 18/14/7/14/7/14, ticket price £65, corporate 20,
# reputation 7650).
[club]
uid = 0x0C                # u32
name = 0xC0               # full name, FM string pointer
short_name = 0xC8         # FM string pointer
women = 0xB9              # u8: 0 men's club, 1 women's club
teams = 0x18              # pointer to the club's team pointers; the first is the senior team
info = 0x100              # info record pointer
finance = 0x150           # finance record pointer
# The club's staff by department, each a (begin, end, capacity) list of pointers. Read on macOS, whose
# club layout is the same, and checked on the Windows Steam and Game Pass builds with Coventry City's coach
# Chris Jones; a move checks the lists hold the member of staff before it writes.
medical_staff = 0x60      # physios, sports scientists, the head of sports science, some fitness coaches
coaching_staff = 0x78     # coaches, assistants, goalkeeping and fitness coaches, analysts, youth managers
scouting_staff = 0x90     # scouts, the chief scout, recruitment analysts
# As on macOS, checked on Steam 26340721 with Arsenal: its rivals (Tottenham 100, Manchester United 90, Chelsea 85,
# Liverpool 75, West Ham 60), its link with Boreham Wood, and England as the country it plays in and its own.
relations = 0x48          # the club's relations, laid out as a person's: code 5 to a club is a rivalry, 0-100
links = 0x118             # list of pointers to its links with other clubs (affiliations)
link_club = 0x08          # in a link: the other club
plays_in = 0xE8           # nation pointer: its own nation (Cardiff City: Wales)
nation = 0xD8             # nation pointer: the nation whose league it plays in (Cardiff City: England)

# A club's stadium (db::STADIUM, 0xC0 bytes), which its senior team points at. Read on the Game Pass build with
# Manchester United's Old Trafford: capacity 74,879, all of it seated, 74,310 in use, room to grow to 95,285; and
# checked against all 30,536 stadiums of that save, whose seats never outnumber their capacity and whose expansion
# ceiling is nearly always at or above it.

[stadium]
team_pointer = 0x78       # in the senior team: pointer to the stadium it plays at
name = 0x40               # FM string pointer
capacity = 0x7C           # u32
seating = 0x80            # u32, seats; never above the capacity
used = 0x84               # u32, the capacity in use when it is limited (Old Trafford 74,310); 0 when it is not
expansion = 0x8C          # u32, the most it can be expanded to
owner = 0x90              # pointer to the club that owns it

[club_info]
season_tickets = 0xC0     # u32
founded = 0xD8            # u16 year
social_media = 0xF8       # u32 followers
supporter_mix = 0x106     # 6 x u8 percentages: hardcore, core, family, fair-weather, casual, other
supporter_traits = 0x114  # 6 x u8, 1..20: loyalty, passion, patience, affluence, temperament, expectations
training = 0x120          # facilities, u8 1..20
youth_facilities = 0x12B
youth_coaching = 0x12C
youth_recruitment = 0x12D

# Only clubs in the leagues being played have the full finance record; the others
# use a smaller class, so readers check that these values look sane before use.
[club_finance]
balance = 0x0C            # i32 pounds
transfer_budget = 0x7C4   # i32 pounds
total_wage_budget = 0x808 # i32 pounds per week
wage_budget = 0x814       # i32 pounds per week, the spending wage budget
ticket_price = 0x864      # f32 pounds, average match ticket
corporate = 0x8A9         # u8 1..20, corporate facilities

[nation]
uid = 0x0C                # u32 (Argentina: 1649, as graphics packs map its flag)
name = 0x18               # FM string pointer

# A player on loan holds a second contract, a db::LOAN_CONTRACT, in this slot of his object (macOS 0x2F8, 0x40
# further as his person block's fields are). Read on Steam 26340721: 1,343 players on loan, Thelo Aasgaard from
# Rangers with a future fee of 5,583,707, Mark Shelton from York City with none (0xFFFFFFFF).
[loan]
slot = 0x338
class = ".?AVLOAN_CONTRACT@db@@"
future_fee = 0xC0

# TRANSFER_MANAGER's records of the work permits players hold, as on macOS but 8 bytes sooner in the manager: a
# (begin, end) of pointers to 0x18-byte records, sorted by player id, each the nation's pointer, the player's id
# (+0x08), the year it was made (+0x10), the day his ESC slot began (+0x12) and flags (+0x16, bit 0 an ESC slot).
# Read on Steam 26340721: 1,152 records; Gabriel and Bruno Guimaraes hold active permits for England. The manager is
# found through the build profile's transfer_manager.
[work_permit]
class = ".?AVTRANSFER_MANAGER@@"
records = 0x718
person = 0x290           # u32 player id, in the person block (person block + 8)
record_size = 0x18
record_person = 0x08
record_esc_since = 0x12
record_flags = 0x16

# Transfers agreed for a later day, laid out as on macOS: TRANSFER_MANAGER's offers and its dated records of them.
# Read on Steam 26340721: 34 dated records, each naming a waiting offer (status 0x13), such as Andria Bartishvili's
# move from Iberia 1999 Tbilisi to Arsenal on 1 July 2027.
[future_transfer]
offers = 0x20
dated = 0x50
dated_owner = 0x18       # what drop_dated_transfer takes, from the manager
record_person = 0x00
record_date = 0x08
record_offer = 0x0C
person_uid = 0x0C        # u32::MAX in a stand-in the game has not looked up yet
person_index = 0x08
offer_id = 0x5C
offer_person = 0x38
offer_to_team = 0x40
offer_from_team = 0x50
offer_status = 0x8D
pending = 0x13

# Competitions (db::COMP) as on macOS, except that their table's vector of pointers sits at +0x80, 8 bytes sooner, as
# for awards and injury kinds. Read on Steam 26340721: 8,221 competitions; the Premier League (UID 11) is in England
# and Europe with reputation 189. Its rule data (ACTUAL_COMP, at `actual`) holds two identical vectors of its 52 rules,
# at +0x38 and +0x80; FM Lens reads the first.
[competition]
class = ".?AVCOMP@db@@"
size = 0x190
table_items = 0x80
index = 0x08
uid = 0x0C
name = 0x40
short_name = 0x48
continent = 0x58
nation = 0x60
place_name = 0x18
reputation = 0x188       # u16, 0..200
women = 0xF9             # u8, nonzero for a women's competition
actual = 0xB0
rules = 0x38

# The kinds of injury (db::INJURY), laid out as on macOS but for the table's vector at +0x80.
[injury_kind]
class = ".?AVINJURY@db@@"
size = 0x78
table_items = 0x80
index = 0x08
uid = 0x0C
manager_class = ".?AVINJURY_MANAGER@@"

# Awards (db::AWARD), laid out as on macOS but for the table's vector at +0x80.
[award]
class = ".?AVAWARD@db@@"
size = 0xA0
table_items = 0x80
index = 0x08
uid = 0x0C
name = 0x30
continent = 0x50
competition = 0x58
nation = 0x60
goalkeepers_only = 0x7C  # u8, nonzero for a goalkeepers' award
prestige = 0x80          # u16
period = 0x86            # u8
women = 0x8A             # u8, nonzero for a women's award
recipients = 0x8D        # u8
max_age = 0x93           # u8, 0 for none

# Languages spoken, as on macOS 0x40 further in a player and 0x38 in a member of staff. Read on Steam 26340721:
# Odegaard English 10, Spanish 5, Swedish 10, Danish 10, Dutch 4, as on macOS; Arteta French 5, English 10,
# Catalan 10, Basque 5, Portuguese 2, Italian 2.
[language]
player = 0x378
staff = 0x1F0
language = 0x00
level = 0x08
name = 0x18

# A match official (db::OFFICIAL), in the array the build profile places. MSVC gives the class a second base, whose
# vtable sits at +0x138, so the index and UID come 0x10 later than on macOS. Read on Steam 26340721: 1,061
# officials; Hyun-Chul Moon (South Korea), born 24 May 1989, CA/PA 200/200, reputation 9891.
# That second vtable is the identity block, which MSVC's vtables keep no offset to: its UID sits 0xC in, at `uid`.
[official]
size = 0x148
identity = 0x138
first_name = 0x28
last_name = 0x30
common_name = 0x38
