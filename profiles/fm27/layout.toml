# What a nation's object holds beyond its UID and name, as on macOS but 8 bytes sooner from the capital on, and its
# competitive record (`container`) 8 bytes sooner but for the FIFA points. Read on Steam 26340721 with England: ENG,
# Europe, London, 57,690,300 people, English 100%, FIFA ranking 4 with 1,922.83 points, founded 1863, joined FIFA
# 1905; the senior team managed by Thomas Tuchel and captained by Harry Kane, the women's by Sarina Wiegman.
[national]
code = 0x28
capital = 0xE8
continent = 0xF0
place_name = 0x18
languages = 0x48
entry_size = 0x10
language_percent = 0x08
population = 0x1E4
dual_nationality = 0x1E9
naturalisation = 0x1ED
container = 0x108
women_container = 0x110
container_nation = 0x170
teams = 0x18
rivals = 0x48
points = 0x274
ranking = 0x568
founded = 0x868
joined_fifa = 0x864
joined_continental = 0x866
youth_rating = 0x86C
game_importance = 0x87D
attendance = 0x889
style = 0x88A
team_manager = 0x80
team_id = 0x0C

# A player's familiarity with his clubs and nations (team cohesion), laid out as on macOS. Read on Steam 26340721:
# Arsenal's players have entries for the club, Gabriel and Saka 100, Rice 62; new signings have none yet.
[cohesion]
list = 0x18
id = 0x00
kind = 0x04
value = 0x05
flag = 0x06
size = 0x08
club_id = 0x08

# STARTING_LOAN, what TRANSFER_MANAGER::start_loan takes, laid out as on macOS: the game's editor (0x29CD370 on Steam
# 26340721) builds it the same way, 0x70 bytes with the player's identity block, the club's senior team, the start and
# end dates and the build's defaults.
[starting_loan]
size = 0x70
player = 0x18
club = 0x20
starts = 0x30
ends = 0x34
defaults = 0x58

# A player's familiarity with his team's tactic, as on macOS but with his record at +0x100: six lists of 4-byte
# entries 0x20 apart, one list of 16-byte entries at +0xC0 and the byte the game sets once it changes them at +0xDC.
# The teams table's pointer to its (begin, end) is at +0x80, 8 bytes sooner. Read on Steam 26340721 (Arsenal: 459).
[tactics]
record = 0x100
lists = [0x00, 0x20, 0x40, 0x60, 0x80, 0xA0]
store = 0xC0
store_value = 0x0E
dirty = 0xDC
team_id = 0x08
teams = 0x80
