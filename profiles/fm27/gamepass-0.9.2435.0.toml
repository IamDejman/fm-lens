# FM27 on Game Pass / Microsoft Store, 0.9.2435.0: the full release of 10 November 2026. Ported from tozmoz's
# FMLibreEditor (GPL-3.0, profiles/fm27/gamepass-0.9.2435.0.toml, commit c1bbd53), where `fmlibre-probe profile`
# passed all 10 checks on a save of 3 January 2028. FM Lens has not run scripts/check-build.sh on this build.
# Its statics sit about 0x2CC000 before those of 0.9.2409.0, though no longer at quite the same distances from each
# other. The object layout is unchanged: the same save read the same before and after the update, field by field.
# No function is traced on this build, so the features that call into the game stay off here.
name = "FM27 0.9.2435.0 (Game Pass)"
edition = 27
storefront = "gamePass"
package_version = "0.9.2435.0"

# The in-game date, 2028-01-03 on that save: 3684 of 3684 contract dates before it, and 155 of 155 current injuries
# begun by then and not over.
current_date = 0x53597C8

# The static pointer to the retirement manager (RETIREMENT_MANAGER), 0xED70 before the players pair (0xED60 in
# 0.9.2409.0), found by searching for pointers to the manager; 424 planned retirements on that save.
retirement_manager = 0x53A9070

# game_plugin.dll as mapped in memory; these two values identify the build.
[plugin]
size_of_image = 0x17969000
link_timestamp = 0x6AE8CF77

# RVAs in game_plugin.dll of the (begin, end) pointer pairs of the entity arrays.
[arrays]
players = 0x53B7DE0
staff = 0x53B7E28
clubs = 0x53B7F98
