# Field offsets inside FM27 objects on macOS (heap data owned by game_plugin).
#
# The Mac build is compiled by clang, which lays classes out by the Itanium C++ ABI where
# Windows uses MSVC's; see docs/recon/fm27-steam-macos.md. The records the people point at
# (contracts, clubs, club info and finances, teams, nations, injuries) are laid out as on
# Windows. Players and staff differ:
# - the player's own fields sit 8 bytes earlier: MSVC keeps a pointer for the virtual bases
#   (a vbptr) there, which clang does not;
# - the person, with the names, birth date, contract and caps, comes right after them, and
#   its fields sit 0x40 earlier than on Windows;
# - the identity block, with the UID, which contracts and captaincies point at, comes last,
#   0x100 later than on Windows. On Windows it comes before the person.
# Measured on the Steam build 26227640 with a new save (13 July 2026): Lionel Messi (UID
# 7458500), Erling Haaland, Paul Ifill (player-coach), René Henriksen and the human manager
# (staff), Tottenham Hotspur and its captains, and injured players.
edition = 27

[player]
uid = 0x394               # u32, in the identity block; the next u32 holds it again
full_name = 0x288         # FM string pointer; may be null
first_name = 0x298        # name-table entry pointer
last_name = 0x2A0         # name-table entry pointer
common_name = 0x2A8       # name-table entry pointer; null when the player has none
date_of_birth = 0x2D0     # u16 day of year (low 9 bits) + u16 year
current_ability = 0x25C   # u16, 1..200
potential_ability = 0x25E # i16, 1..200; negative values are ranges
nation = 0x2B0            # nation pointer
relations = 0x2C0         # pointer to the record of his relations: secondary nationalities, homegrown status
team = 0x128              # team pointer; the club hangs off the team

# The person starts here, and the identity block follows it. Player-coaches carry an extra
# block in front of the person, so both sit 0xF8 further for them, as on Windows.
person_block = 0x278
identity = 0x388
person_block_shifts = [0x0, 0xF8]

height = 0x226            # u16, centimetres
match_sharpness = 0x250   # u16, 0..10000
condition = 0x254         # u16, the energy the game shows
# i16, -500 when rested; between the two as on Windows. On the Mac save all 37,980 players read from -500 to 643,
# 1,835 of them at -500; Arsenal's regular starters read 255 to 391, its injured -500.
jadedness = 0x252
morale = 0x264            # u8, 1..20
# u64, in the person, 0x40 earlier as on Windows: Messi reads bits 7 10 16 17 19 20 49 51, as FMRTE shows them.
traits = 0x308
injuries = 0xF0           # pointer to the injury record; null for a player who was never injured
transfer_value = 0x22C    # i32, base valuation in pounds; 300,000,000 is the unvalued marker
asking_price = 0x230      # i32, pounds; -1 when not set
home_reputation = 0x256   # u16
current_reputation = 0x258
world_reputation = 0x25A
international_caps = 0x37C  # u16 (Messi: 207 caps, 125 goals)
international_goals = 0x37E # u16
u21_caps = 0x380          # u8 (Messi: 18 caps, 14 goals)
u21_goals = 0x381         # u8
contract = 0x2F0          # contract pointer
# 15 ratings, 1..20: GK, SW, DL, DC, DR, DM, ML, MC, MR, AML, AMC, AMR, ST, WBL, WBR
positions = 0x148
# Pointer to the (begin, end, capacity) list of 0x18-byte records the game keeps of his positions and writes
# his ratings back from: read in the position setter of the ARM64 and of the Intel half, each on its own.
position_records = 0x1A0
# 8 ratings, 1..20: adaptability, ambition, loyalty, pressure, professionalism,
# sportsmanship, temperament, controversy
personality = 0x2B8

# u8, raw 0..100, shown in game as (raw + 2) / 5; each 8 bytes earlier than on Windows
[player.attributes]
corners = 0x172
crossing = 0x157
dribbling = 0x158
finishing = 0x159
first_touch = 0x16D
free_kicks = 0x17A
heading = 0x15A
long_shots = 0x15B
long_throws = 0x175
marking = 0x15C
passing = 0x15E
penalty_taking = 0x15F
tackling = 0x160
technique = 0x16E
aggression = 0x184
anticipation = 0x168
bravery = 0x182
composure = 0x18B
concentration = 0x18C
decisions = 0x169
determination = 0x18A
flair = 0x171
leadership = 0x17F
off_the_ball = 0x15D
positioning = 0x16B
teamwork = 0x173
vision = 0x161
work_rate = 0x174
acceleration = 0x179
agility = 0x185
balance = 0x181
jumping_reach = 0x17E
natural_fitness = 0x189
pace = 0x17D
stamina = 0x17C
strength = 0x17B
aerial_reach = 0x163
command_of_area = 0x164
communication = 0x165
eccentricity = 0x176
handling = 0x162
kicking = 0x166
one_on_ones = 0x16A
punching = 0x178
reflexes = 0x16C
rushing_out = 0x177
throwing = 0x167
consistency = 0x183
dirtiness = 0x180
important_matches = 0x186
injury_proneness = 0x187
versatility = 0x188
left_foot = 0x16F
right_foot = 0x170

# As on Windows: a contract's owner points at the identity block of its player or member of
# staff (Messi: wage, joined 15 July 2023, squad number 10).
[contract]
owner = 0x08
wage = 0x20
signed = 0x44
expires = 0x48
joined = 0x4C
squad_status = 0x54
listing = 0x57
squad_number = 0x5D
team = 0x10
senior_team = 0x18
job = 0x26
# As on Windows, where the rest of the contract is laid out alike. Kylian Mbappé's list holds his release clause
# (859,031,872 pounds) and three bonuses, and his loyalty bonus reads 50,098 a week, Erling Haaland's 43,634, as
# FMRTE shows them on Windows. 1,998 players have a record of reasons to be unhappy, holding 1 to 6 entries.
clauses = 0x68
competition_bonuses = 0x80
loyalty_bonus = 0x38
happiness = 0x5A
playing_time_happiness = 0x5C
unhappiness = 0x30

# A loaned player's loan, a contract of its own (db::LOAN_CONTRACT) laid out as [contract]: its owner is the player, its
# team the borrower's, its wage what the borrower pays, its expiry when the loan ends. The player keeps his contract
# with his parent club. Read on Steam 26340721 arm64: 735 loan contracts; Ben White (Arsenal, at West Ham United),
# 55,000 of his 110,000 a week, loan from 10 Aug 2027 to the end of June 2028. Not yet compared with FM's screens.
[loan]
slot = 0x2F8
class = "N2db13LOAN_CONTRACTE"
# The loan's future fee, a u32 past the contract's fields, 0xFFFFFFFF for none: White's 58,000,000 (his option to buy),
# none on Harriman-Annous'. Ending a loan with a mandatory future fee early completes the transfer.
future_fee = 0xC0

# Relative to the players (begin, end) pair, as on Windows; the static data between them is
# laid out differently, so this sits 0xC0 further. It read the date in a new game, but an
# unset date (1 January 1900) right after loading a save: the build profiles name the date
# itself, a variable of its own away from the arrays.
[work_permit]
# TRANSFER_MANAGER keeps a record per player and nation he holds a work permit for, 0x18 bytes each: the nation's
# pointer, the player's id (+0x08), the year the record was made (+0x10), the day his ESC slot began (+0x12, unset
# 1 Jan 1900) and flags (+0x16, bit 0 an ESC slot: FM's one-year exception for an under-23, not a permit). FM shows
# a record without the flag as an active work permit, and no record as none. Read on 11 Dec 2027: 1,045 records,
# all for England, 25 ESC slots, which is also the length of the manager's list of them at +0x780. The manager is
# found through the build profile's transfer_manager.
class = "16TRANSFER_MANAGER"
records = 0x720          # (begin, end) of pointers to the records, sorted by player id
person = 0x390           # u32 player id, in the identity block (identity + 8)
record_size = 0x18
record_person = 0x08
record_esc_since = 0x12
record_flags = 0x16

# Competitions (db::COMP, 0x1B0 bytes each) and awards (db::AWARD, 0xA0), as their database tables list them: the
# table points at its vector of pointers at +0x88, and each object holds its place in it at +0x08 and its UID at +0x0C.
# Read on 11 Dec 2027: the Premier League (UID 11) is in England and Europe with reputation 190; 738 competitions are
# women's. Of the awards, the Premier League Golden Glove is for goalkeepers and the Young Player of the Year for
# players of 22 or under. A nation's and a continent's name are at +0x18.
[competition]
class = "N2db4COMPE"
size = 0x190
table_items = 0x88
index = 0x08
uid = 0x0C
name = 0x40
short_name = 0x48
continent = 0x58
nation = 0x60
place_name = 0x18
reputation = 0x188       # u16, 0..200
women = 0xF9             # u8, nonzero for a women's competition
# Its loaded rule data (ACTUAL_COMP) and the vector of its rules there: 52 for the Premier League, 48 for the Champions
# League. Read on Steam 26340721 arm64; the rules are not yet compared with FM's screens.
actual = 0xB0
rules = 0x50

# The kinds of injury (db::INJURY): a database table at a static of the build profile (`injury_kinds`), its vector of
# pointers at +0x88, each kind 0x78 bytes with its place at +0x08 and its UID at +0x0C. 136 kinds on 11 Dec 2027; the
# name is at the injury's `kind_name`.
[injury_kind]
class = "N2db6INJURYE"
size = 0x78
table_items = 0x88
index = 0x08
uid = 0x0C
manager_class = "14INJURY_MANAGER"

# STARTING_LOAN, what TRANSFER_MANAGER::start_loan takes, as the game's editor builds it (0x238D860, traced statically
# on build 26340721): the vtable at +0x00, -1 in +0x08..+0x0F and +0x3C..+0x48, unset dates (1 Jan 1900) at +0x30,
# +0x34 and +0x38, the build's defaults at +0x58 and 0xFF at +0x6F; the rest 0. The player is his identity block
# (start_loan reads its id at +0x08 and UID at +0x0C and asks its vtable for the player), the club its senior team.
[starting_loan]
size = 0x70
player = 0x18
club = 0x20
starts = 0x30
ends = 0x34
defaults = 0x58

# Transfers agreed for a later day, which TRANSFER_MANAGER (the build profile's transfer_manager) keeps, traced
# statically on build 26340721 (docs/recon/fm27-call-shapes.md section 5). Its offers are a (begin, end) of pointers
# at `offers`; a signing dated after today stays there, pending, and a record of it joins the (begin, end) of
# pointers at `dated`, with the offer's id at `record_offer`. In an offer: its id, the player's identity block (once
# the game has looked it up), the team he joins and the one he leaves, and its status byte (`pending` until the day).
[future_transfer]
offers = 0x20
dated = 0x50
dated_owner = 0x18       # what drop_dated_transfer takes, from the manager
record_person = 0x00
record_date = 0x08
record_offer = 0x0C
person_uid = 0x0C        # u32::MAX in a stand-in the game has not looked up yet
person_index = 0x08
offer_id = 0x5C
offer_person = 0x38
offer_to_team = 0x40
offer_from_team = 0x50
offer_status = 0x8D
pending = 0x13

[award]
class = "N2db5AWARDE"
size = 0xA0
table_items = 0x88
index = 0x08
uid = 0x0C
name = 0x30
continent = 0x50
competition = 0x58
nation = 0x60
goalkeepers_only = 0x7C  # u8, 1 for a goalkeepers' award
prestige = 0x80          # u8, 0..20
period = 0x86            # u8: 1 weekly, 2 monthly, 3 each season, 4 at the end of the competition, 5 each calendar
                         # year, 6 each year (World Golden Ball: 26 Oct to 25 Oct), 7 each round
women = 0x8A             # u8, 1 for a women's award
recipients = 0x8D        # u8: 1 a player, 2 a manager, 7 a team of players
max_age = 0x93           # u8, 0 for any age

[cluster]
current_date = 0x908

# Staff's own fields (attributes, reputation, CA/PA) are where they are on Windows. The
# person starts at 0xF8, 8 earlier than the identity block on Windows, and the identity
# block follows it at 0x208. The human manager's person and identity block sit 0x340
# further, as on Windows (checked on the test save's own manager).
[staff]
uid = 0x214               # u32 staff id, in the identity block
relations = 0x140         # pointer to the record of his relations, laid out as a player's
full_name = 0x108         # FM string pointer; often null
first_name = 0x118        # name-table entry pointer
last_name = 0x120         # name-table entry pointer
common_name = 0x128       # name-table entry pointer
nation = 0x130            # nation pointer
personality = 0x138       # 8 ratings, same order as for players
date_of_birth = 0x150     # date
contract = 0x170          # contract pointer
home_reputation = 0xD4    # u16
current_reputation = 0xD6
world_reputation = 0xD8
current_ability = 0xDA    # u16
potential_ability = 0xDC  # u16
person_block = 0xF8
identity = 0x208
person_block_shifts = [0x0, 0x340]
# i8 coaching licence: 1 to 8 a level; -1 to -7 also levels 2 to 8, as the game reads it (property 'Pcqu', 0xCD6F8C
# in the arm64 half of 27.0.0); any other value none. FM's Coaching Qualification, checked on Arsenal's staff: 1
# Continental Pro, 2 Continental A, 3 Continental B, 4 Continental C, 5 National A, 7 National C, 8 and 0 No
# Qualifications; -1 Continental A "studying for a Continental Pro Licence" (-n: level n + 1, studying for n).
coaching_licence = 0x204
# u8 formation ids of his preferred formation in possession ('Nppf') and out of possession ('oopF'), the two lines of
# FM's "Preferred Formations" (set at 0xC9694C, read by 0x2B52CD4 in the arm64 half of 27.0.0). The bytes between are
# his second, defensive and attacking ones in possession (+0xE0..+0xE2), then out of possession (+0xE4..+0xE6), which
# FM's profile does not show. 0 for none, on 81 of 20,219 staff on 11 Dec 2027.
formations = [0xDF, 0xE3]

# u8, raw 0..100, shown as (raw + 2) / 5; as on Windows
[staff.attributes]
attacking = 0x32
defending = 0x33
fitness = 0x34
goalkeeping = 0x2B
possession = 0x35
tactical = 0x37
technical = 0x36
set_pieces = 0x43
determination = 0x1D
motivating = 0x2F
people_management = 0x2E
judging_ability = 0x2C
judging_potential = 0x2D
judging_staff = 0x42
negotiating = 0x41
tactical_knowledge = 0x31
data_analysis = 0x3C
physiotherapy = 0x30
sports_science = 0x3F

# u8 ratings stored as shown, 1..20; as on Windows
[staff.ratings]
working_with_youngsters = 0x1C
authority = 0x14

# The injury, team, club and nation records are laid out as on Windows.
[injury]
kind = 0x08
team = 0x18
started = 0x20
longest = 0x28
shortest = 0x2A
kind_name = 0x18

# A player's current bans sit in the same record as his injuries: after the list of his
# current injuries, a list of his absences, 32-byte entries. Other absences, such as a
# call-up, are listed with them; a ban has 0xFFFF at `marker`, they have 0. Regan
# Charles-Cook (Motherwell): one match, from 23 July 2026, as the game shows.
[ban]
list = 0x18               # in the record: the list (begin, end, capacity) of absences
started = 0x10            # date the ban began
marker = 0x16             # u16, 0xFFFF for a ban
matches = 0x1C            # u8, matches left to miss

# A promise made to a person (INTERACTION_PROMISE, 0x60 bytes), from the game's code (docs/recon/fm27-promises.md).
# His list hangs off his person block, and also holds the promises he made: those point at someone else at `person`.
# A closed promise has bit 0 of `closed` set, the end date at `due` and a status other than 0. FM drops closed promises
# 31 days after they end. Arsenal, 11 Dec 2027: FM's Promises page listed the one promise with a `category` (Nico Paz,
# playing time, due 23 Jan 2028), and none of the 17 a squad meeting left with category 0.
[promise]
list = 0xA8               # in the person block: pointer to the list (begin, end, capacity) of his promises
person = 0x20             # pointer back at him
made = 0x38               # date
due = 0x3C                # date: due while open, ended once closed
id = 0x4E                 # u16, FM's number for the promise
closed = 0x53             # u8, bit 0
category = 0x55           # u8, 0 for the promises FM's Promises page does not list
status = 0x56             # u8, 0 while open; 1 ended without being held against him

# A person's relations: the list of 16-byte entries the record of his `relations` starts with. Each points at a
# nation, club, person or competition and says how he is tied to it. Kenan Yıldız (Juventus): Germany, his
# secondary nationality (9); Germany and Italy, trained in (70, Homegrown 15-21); FC Bayern and Juventus, trained
# at (72), as the game's eligibility page shows them.
[relation]
target = 0x00             # pointer to the nation, club, person or competition
target_kind = 0x0A        # u8: 1 a club, 3 a person, 7 a competition, 8 a nation
relation = 0x0B           # u8: 9 a nationality, 70 trained in a nation, 72 trained at a club; to a person 1 favoured,
                          # 2 disliked; to a club 3 favoured, 4 disliked
value = 0x0C              # u8: of a training, the homegrown rule it meets; i8: of a preference, its strength
size = 0x10

# Languages spoken besides, usually, the native one. Read on Steam 26340721 arm64 from a sample of players
# and staff (Odegaard: English 10, Spanish 5, Swedish 10, Danish 10, Dutch 4); not yet compared with FM's screens.
[language]
player = 0x338
staff = 0x1B8
language = 0x00
level = 0x08
name = 0x18

# A match official, in the array the build profile places. Michael Oliver (UID 103994): England, born 20 February
# 1985, CA/PA 180/180, reputation 8388. Not yet compared with FM's screens.
[official]
size = 0x148
first_name = 0x20
last_name = 0x28
common_name = 0x30
nation = 0x38
date_of_birth = 0x58
current_ability = 0x114
potential_ability = 0x116
reputation = 0x118
uid = 0x134

# A nation's facts and its men's national team container. Read on Steam 26340721 arm64 for all 251 nations: England
# is ranked 4th on 1922.83 points, its association was founded in 1863 and joined FIFA in 1905; its rivals are
# Scotland 100, Germany 100, Argentina 90. Argentina takes 2 years of residence, Spain 10; China, Japan and India do
# not allow dual nationality. National teams are laid out as a club's ([team]). Not yet compared with FM's screens.
# The women's container is laid out as the men's: England's women joined FIFA and UEFA in 1972 and have a youth rating
# of 161, the men 135 (joined UEFA 1954). The women's senior team ids are not the nation's UID (England's 2000169621).
# Game importance (i8, 0 to 4) and attendance (u8, 0 to 16) are FM's 'Ngim' and 'Natt' (docs/recon/fm27-nations-clubs-2.md).
[national]
code = 0x28
capital = 0xF0
continent = 0xF8
place_name = 0x18
languages = 0x48
entry_size = 0x10
language_percent = 0x08
population = 0x1EC
dual_nationality = 0x1F1
naturalisation = 0x1F5
container = 0x110
women_container = 0x118
container_nation = 0x170
teams = 0x18
rivals = 0x48
points = 0x378
ranking = 0x570
founded = 0x870
joined_fifa = 0x86C
joined_continental = 0x86E
youth_rating = 0x874
game_importance = 0x885     # England men 1; the men's most common is 1, the women's 4
attendance = 0x891          # England men 15, women 10
# Twelve i8 style ratings, 0 to 20, most 10; the 17 nations that play no football read 0 in all of them. Named
# from FM's codes (Ndep, Ndir, Nflm, Nflx, Nfrl, Nmar, Noff, Nprs, Nstb, Ntpo, Nupm, Nwid) in this order.
style = 0x892
team_manager = 0x80
team_id = 0x0C            # the senior team's is the nation's UID (251 of 251)

# A player's familiarity with his clubs and nations (team cohesion): the second list of his relations record, of
# 8-byte entries. Checked on Steam 26340721 arm64: every Arsenal player has a club entry with Arsenal's internal id
# 331 (UID 602), Rice 100, Konsa 48, Pacho 50. Not checked on Windows.
[cohesion]
list = 0x18
id = 0x00
kind = 0x04
value = 0x05
flag = 0x06
size = 0x08
club_id = 0x08

# The retirements the game has planned, as on Windows: the manager's two lists and its 24-byte entries are laid out
# alike. The static pointer to the manager is a variable of its own, which the build profiles place.
[retirement]
planned = 0x30
by_person = 0x90
person = 0x00
date = 0x0C
player_person = 0x390     # in the identity block, 8 bytes in, as on Windows

[team]
club = 0x30
kind = 0x28
age_limit = 0x2C
players = 0x38
captain = 0x88            # Tottenham: Micky van de Ven, as on Windows
vice_captain = 0x90       # Tottenham: Pedro Porro
reputation = 0xA8         # Tottenham: 7650
# The manager's object, as for a national team; the game's signing of a manager dismisses the one it finds here
# (0x2DFFC98 in the arm64 half of Steam build 26340721, docs/recon/fm27-manager-moves.md).
manager = 0x80
national = 0x2F           # u8: 0 for a club's team, else a nation's (set_work_permit reads it)

# A team's dynamics record, from the game's code (docs/EDITING-VALIDATION.md). A team points at a holder, which points
# at the record; the record points back at its team. It keeps the dressing room atmosphere (i8 at 0xCB) and the support
# for the manager (i8 at 0xCE), each with the date the game worked it out. The game's own logic, such as the squad
# complaining about the atmosphere, reuses a score for seven days after its date; FM's Dynamics screen does not.
# Arsenal, 10 Dec 2027: atmosphere -62, worked out on 7 Dec.
[dynamics]
holder = 0xA0             # in a team: pointer to the holder
record = 0xC8             # in the holder: pointer to the record
team = 0x40               # in the record: pointer back at the team
atmosphere_date = 0xA8    # date the atmosphere score was worked out; 1 Jan 1900 before the first time
support_date = 0xAC       # date the support score was worked out

# The game brings its own allocator to macOS: it carves the chunks it gets from malloc into
# blocks of the same size classes as on Windows (blocks of 8 bytes too, which malloc never
# hands out). Measured natively with probe `squads`: 837 of the 853 team lists of 145 to
# 512 bytes had their class's slack zeroed after their capacity. The other 16 had grown
# past their length and held old data there, at their class's spacing.
[heap]
block_sizes = [144, 160, 192, 224, 256, 288, 320, 384, 448, 512]

# Tottenham Hotspur (UID 728): 50,000 season tickets, founded 1882, supporter traits
# 18/14/7/14/7/14, £65 tickets, corporate facilities 20.
[club]
uid = 0x0C
relations = 0x48          # the club's relations, laid out as a person's: code 5 to a club is a rivalry, 0-100
links = 0x118             # list of pointers to its links with other clubs (affiliations)
link_club = 0x08          # in a link: the other club
# The country a club is in, as the game's own lookup (0xe015c4 on Steam 26340721 arm64) finds it for most clubs: the
# nation it plays in when based abroad, else its own nation. The lookup names a few clubs by UID instead.
plays_in = 0xE8
nation = 0xD8
name = 0xC0
short_name = 0xC8
women = 0xB9
teams = 0x18
info = 0x100
finance = 0x150
medical_staff = 0x60
coaching_staff = 0x78
scouting_staff = 0x90

# Stadiums are laid out as on Windows: Old Trafford reads 74,879, 74,310 in use, room to grow to 95,285; the
# Emirates 60,704, the Tottenham Hotspur Stadium 62,850, the Amex 31,876.
[stadium]
team_pointer = 0x78
name = 0x40
capacity = 0x7C
seating = 0x80
used = 0x84
expansion = 0x8C
owner = 0x90

[club_info]
season_tickets = 0xC0
founded = 0xD8
social_media = 0xF8
supporter_mix = 0x106
supporter_traits = 0x114
training = 0x120
youth_facilities = 0x12B
youth_coaching = 0x12C
youth_recruitment = 0x12D

[club_finance]
balance = 0x0C
transfer_budget = 0x7C4
total_wage_budget = 0x808
wage_budget = 0x814
ticket_price = 0x864
corporate = 0x8A9

[nation]
uid = 0x0C                # Argentina: 1649
name = 0x18

# A player's familiarity with his team's tactic, traced statically in the game's editor action at 0x2392540 (Steam
# 26340721 arm64) and read on Saka: his record at +0xF8 holds six lists of 4-byte entries 0x20 apart (the
# familiarity in the low 14 bits, a signed key in bits 14..19), one list of 16-byte entries at +0xC0 (the familiarity
# the u16 at +0x0E) and the byte the game sets once it changes them at +0xDC. Familiarity runs to 10000. The game only
# changes an entry in place or adds one at the end. A team's id is the u32 at +0x08 (Arsenal's senior team: 462), its
# entry in the teams table, whose pointer at +0x88 leads to its (begin, end) of teams.
[tactics]
record = 0xF8
lists = [0x00, 0x20, 0x40, 0x60, 0x80, 0xA0]
store = 0xC0
store_value = 0x0E
dirty = 0xDC
team_id = 0x08
teams = 0x88
