# FM27 on Game Pass / Microsoft Store, 0.9.2562.0: the update of 24 November 2026 (27.1.1 on Steam). Ported from
# tozmoz's FMLibreEditor (GPL-3.0, profiles/fm27/gamepass-0.9.2562.0.toml, commit e0fe879), where
# `fmlibre-probe profile` passed all 12 checks on a save of 4 August 2027. FM Lens has not run scripts/check-build.sh on this build.
# The statics moved back from those of 0.9.2524.0: the arrays and the retirement manager by 0x1FE0, the date by
# 0x2000. The object layout is that of 0.9.2524.0.
# No function is traced on this build, so the features that call into the game stay off here.
name = "FM27 0.9.2562.0 (Game Pass)"
edition = 27
storefront = "gamePass"
package_version = "0.9.2562.0"

# The in-game date, 2027-08-04 on that save: 3788 of 3788 contract dates before it, and 78 of 78 current injuries
# begun by then and not over.
current_date = 0x539BD10

# A club's corporate facilities in its finance record, at 0x8AD as on 0.9.2524.0 (layout.toml has 0x8A9). FMLibreEditor
# keeps that offset for this build; neither it nor FM Lens names the clubs it was read on here.
club_finance_corporate = 0x8AD

# The static pointer to the retirement manager (RETIREMENT_MANAGER), 0xD2E8 before the players pair as in
# 0.9.2524.0; 576 planned retirements on that save.
retirement_manager = 0x53EBBC0

# game_plugin.dll as mapped in memory; these two values identify the build.
[plugin]
size_of_image = 0x17624000
link_timestamp = 0x6AFF583B

# RVAs in game_plugin.dll of the (begin, end) pointer pairs of the entity arrays.
[arrays]
players = 0x53F8EA8
staff = 0x53F8EF0
clubs = 0x53F9060
